name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clone repository manually
      run: |
        git clone https://github.com/${{ github.repository }}.git .
        git checkout main

    - name: Set up Java
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        java -version

    - name: Set up Flutter SDK
      run: |
        git clone https://github.com/flutter/flutter.git -b 3.19.0 --depth 1 _flutter
        echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH

    - name: Inject custom code and Build APK
      run: |
        flutter create temp_project --org com.example.sellkaro
        
        # प्रोजेक्ट के डिफ़ॉल्ट फोल्डर को खाली करके आपकी फाइलें कॉपी करते हैं
        rm -rf temp_project/lib/*
        cp *.dart temp_project/lib/ 2>/dev/null || true
        
        # Linux केस-सेंसिटिविटी एरर रोकने के लिए सभी फाइलों के नाम लोअरकेस करते हैं
        cd temp_project/lib
        for f in *.dart; do
          if [ -f "$f" ]; then
            low=$(echo "$f" | tr '[:upper:]' '[:lower:]')
            if [ "$f" != "$low" ]; then
              mv "$f" "$low"
            fi
          fi
        done
        cd ../..
        
        cd temp_project
        
        # सभी आवश्यक पैकेज एक साथ जोड़ते हैं
        flutter pub add firebase_core firebase_auth cloud_firestore image_picker
        
        flutter pub get
        flutter build apk --release

    - name: Copy APK for Artifacts
      run: |
        mkdir -p final_output
        cp temp_project/build/app/outputs/flutter-apk/app-release.apk final_output/app-release.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: final_output/app-release.apk
