name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clone repository manually
      run: |
        git clone https://github.com/${{ github.repository }}.git .
        git checkout main

    - name: Set up Java
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        java -version

    - name: Set up Flutter SDK
      run: |
        git clone https://github.com/flutter/flutter.git -b 3.19.0 --depth 1 _flutter
        echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH

    - name: Inject custom code and Build APK
      run: |
        flutter create temp_project --org com.example.sellkaro
        
        # Copy all custom dart files
        cp *.dart temp_project/lib/ 2>/dev/null || true
        
        # Check and inject pubspec.yaml or add Firebase dependencies if missing
        if [ -f "pubspec.yaml" ]; then
          cp pubspec.yaml temp_project/
        fi

        cd temp_project
        
        # Automatically ensure firebase dependencies exist in pubspec.yaml
        flutter pub add firebase_core firebase_auth || true

        # Handle main entry point file mapping correctly
        if [ -f "lib/Main.dart" ]; then
          cp lib/Main.dart lib/main.dart
        elif [ -f "lib/main.dart" ]; then
          echo "main.dart already exists"
        elif [ -f "lib/Home.dart" ]; then
          cp lib/Home.dart lib/main.dart
        fi

        flutter pub get
        flutter build apk --release

    - name: Copy APK for Artifacts
      run: |
        mkdir -p final_output
        cp temp_project/build/app/outputs/flutter-apk/app-release.apk final_output/app-release.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: final_output/app-release.apk
