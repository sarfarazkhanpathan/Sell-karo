name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clone repository manually
      run: |
        git clone https://github.com/${{ github.repository }}.git .
        git checkout main

    - name: Set up Java
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        java -version

    - name: Set up Flutter SDK
      run: |
        git clone https://github.com/flutter/flutter.git -b 3.19.0 --depth 1 _flutter
        echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH

    - name: Inject custom code and Build APK
      run: |
        flutter create temp_project --org com.example.sellkaro
        
        # Clear default lib files and copy all custom files safely
        rm -rf temp_project/lib/*
        cp *.dart temp_project/lib/ 2>/dev/null || true
        
        cd temp_project
        
        # Add all required Firebase and utility dependencies used in your app
        flutter pub add firebase_core firebase_auth cloud_firestore image_picker
        
        # Ensure main entry point exists, fallback if Main.dart is present
        if [ -f "lib/Main.dart" ] && [ ! -f "lib/main.dart" ]; then
          mv lib/Main.dart lib/main.dart
        elif [ -f "lib/Home.dart" ] && [ ! -f "lib/main.dart" ]; then
          mv lib/Home.dart lib/main.dart
        fi

        flutter pub get
        flutter build apk --release

    - name: Copy APK for Artifacts
      run: |
        mkdir -p final_output
        cp temp_project/build/app/outputs/flutter-apk/app-release.apk final_output/app-release.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: final_output/app-release.apk
