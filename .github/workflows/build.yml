name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        java -version

    - name: Set up Flutter SDK
      run: |
        git clone https://github.com/flutter/flutter.git -b 3.19.0 --depth 1 _flutter
        echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH

    - name: Inject custom code and Build APK
      run: |
        # नया डिफ़ॉल्ट प्रोजेक्ट बनाते हैं
        flutter create temp_project --org com.example.sellkaro
        
        # आपकी सारी डार्ट फाइलों को नए प्रोजेक्ट के lib फोल्डर में कॉपी करते हैं
        cp *.dart temp_project/lib/ 2>/dev/null || true
        cp pubspec.yaml temp_project/ 2>/dev/null || true
        
        # अगर आपकी मेन फाइल का नाम Main.dart है, तो उसे Flutter की डिफ़ॉल्ट main.dart बना देते हैं
        if [ -f "temp_project/lib/Main.dart" ]; then
          cp temp_project/lib/Main.dart temp_project/lib/main.dart
        elif [ -f "temp_project/lib/Home.dart" ]; then
          cp temp_project/lib/Home.dart temp_project/lib/main.dart
        fi

        # फोल्डर में जाकर APK बिल्ड करते हैं
        cd temp_project
        flutter pub get
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: temp_project/build/app/outputs/flutter-apk/app-release.apk
