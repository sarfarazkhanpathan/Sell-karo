name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clone repository manually
      run: |
        git clone https://github.com/${{ github.repository }}.git .
        git checkout main

    - name: Set up Java
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        java -version

    - name: Set up Flutter SDK
      run: |
        git clone https://github.com/flutter/flutter.git -b 3.19.0 --depth 1 _flutter
        echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH

    - name: Inject custom code and Build APK
      run: |
        flutter create temp_project --org com.example.sellkaro
        
        # Copy all root dart files into the temporary project lib folder
        cp *.dart temp_project/lib/ 2>/dev/null || true
        
        cd temp_project
        
        # Explicitly add required Firebase dependencies
        flutter pub add firebase_core firebase_auth
        
        # Handle Main file mapping and auto-import all other dart files if needed
        if [ -f "lib/Main.dart" ]; then
          cp lib/Main.dart lib/main.dart
        elif [ -f "lib/Home.dart" ]; then
          cp lib/Home.dart lib/main.dart
        fi

        # Automatically inject imports for all other .dart files into main.dart to resolve missing class references
        cd lib
        if [ -f "main.dart" ]; then
          for f *.dart; do
            if [ "$f" != "main.dart" ] && [ "$f" != "Main.dart" ]; then
              sed -i "1i import '$f';" main.dart
            fi
          done
        fi
        cd ..

        flutter pub get
        flutter build apk --release

    - name: Copy APK for Artifacts
      run: |
        mkdir -p final_output
        cp temp_project/build/app/outputs/flutter-apk/app-release.apk final_output/app-release.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: final_output/app-release.apk
