name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        java -version

    - name: Set up Flutter SDK
      run: |
        git clone https://github.com/flutter/flutter.git -b 3.19.0 --depth 1 _flutter
        echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH

    - name: Create fresh Flutter project structure & inject files
      run: |
        # एक नया सही स्ट्रक्चर वाला फ्लटर प्रोजेक्ट अस्थायी रूप से बनाते हैं
        flutter create temp_project --org com.example.sellkaro
        
        # अपनी मौजूदा dart फाइलों और pubspec.yaml को नए प्रोजेक्ट के lib फोल्डर में कॉपी करते हैं
        mkdir -p temp_project/lib
        cp *.dart temp_project/lib/ 2>/dev/null || true
        cp pubspec.yaml temp_project/ 2>/dev/null || true
        
        # प्रोजेक्ट वाले फोल्डर में मूव होते हैं
        cd temp_project
        flutter pub get
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: temp_project/build/app/outputs/flutter-apk/app-release.apk
